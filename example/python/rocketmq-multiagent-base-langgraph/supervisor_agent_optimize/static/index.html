<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>AI Agent Chat - Streaming</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin: 0 0 8px 0;
        }
        .session-info {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .session-label {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }
        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 0.7em;
            color: white;
            margin-left: 6px;
            opacity: 0.9;
        }
        #chat-box {
            background: white;
            height: 600px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .msg {
            margin: 12px 0;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            text-align: right;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .agent {
            background: #f8f9fa;
            color: #333;
            margin-right: auto;
            border: 1px solid #e9ecef;
        }
        .status {
            text-align: center;
            color: #6c757d;
            font-size: 0.9em;
            margin: 8px 0;
            font-style: italic;
            padding: 8px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        .success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }
        .agent-label {
            font-size: 0.85em;
            color: #667eea;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .agent-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #667eea;
            animation: blink 1s infinite;
            margin-left: 2px;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .input-area {
            display: flex;
            gap: 12px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .trace-info {
            font-size: 0.75em;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>🤖 LangGraph Supervisor + RocketMQ Streaming</h2>
    <div class="session-info">
        <span class="session-label">Session:</span>
        <span class="session-id" id="session-id-display"></span>
    </div>
</div>
<div id="chat-box"></div>
<div class="input-area">
    <input type="text" id="user-input" placeholder="例如：杭州明天天气？ 或 帮我做杭州下周六自驾游规划" onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">发送</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');

    // Generate session ID when page loads
    const sessionId = generateUUID();

    // Display session ID on page
    document.getElementById('session-id-display').textContent = sessionId;

    // Function to generate UUID v4
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // Track active message elements for streaming updates
    let activeMessageElements = {};
    let isProcessing = false;
    let statusDiv = null;

    function appendMessage(role, content, label = null, isStatus = false, isError = false, isSuccess = false) {
        if (isStatus) {
            const div = document.createElement('div');
            div.className = `status ${isError ? 'error' : isSuccess ? 'success' : ''}`;
            div.innerHTML = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        const div = document.createElement('div');
        div.className = `msg ${role}`;

        if (label) {
            const span = document.createElement('span');
            span.className = 'agent-label';
            span.innerText = label;
            div.appendChild(span);
        }

        const contentDiv = document.createElement('div');
        contentDiv.className = 'agent-content';
        contentDiv.innerHTML = content.replace(/\n/g, '<br>');
        div.appendChild(contentDiv);

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return contentDiv;
    }

    function updateMessageContent(contentDiv, newContent) {
        if (contentDiv) {
            contentDiv.innerHTML = newContent.replace(/\n/g, '<br>');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function showLoading(message = '⏳ 智能体正在思考中') {
        if (statusDiv) {
            statusDiv.remove();
        }
        statusDiv = appendMessage('',
            `${message}<div class="loading-dots"><span></span><span></span><span></span></div>`,
            null, true);
    }

    function hideLoading() {
        if (statusDiv) {
            statusDiv.remove();
            statusDiv = null;
        }
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        // Disable input during processing
        input.disabled = true;
        sendBtn.disabled = true;
        isProcessing = true;

        // Clear previous state
        activeMessageElements = {};
        statusDiv = null;

        appendMessage('user', text);
        input.value = '';

        let accumulatedContent = {};
        let hasReceivedResponse = false;
        let lastAgentRole = null;

        try {
            // Show initial loading immediately
            showLoading('⏳ 智能体正在思考中');
            console.log('[UI] Loading shown');

            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    message: text,
                    session_id: sessionId
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);

                        if (data === '[DONE]') {
                            console.log('[UI] Received [DONE]');
                            hideLoading();

                            // Remove typing cursor from all messages
                            Object.values(activeMessageElements).forEach(div => {
                                const cursor = div.querySelector('.typing-cursor');
                                if (cursor) cursor.remove();
                            });

                            // Show completion message
                            if (hasReceivedResponse) {
                                appendMessage('', '✅ 回复完毕', null, true, false, true);
                            }
                            continue;
                        }

                        try {
                            const obj = JSON.parse(data);

                            if (obj.type === 'start') {
                                console.log('[UI] Start event:', obj.trace_id);

                            } else if (obj.type === 'chunk') {
                                hasReceivedResponse = true;

                                const labels = {
                                    'weather': '🌤️ Weather Agent',
                                    'travel': '✈️ Travel Agent',
                                    'assistant': '🤖 Assistant',
                                    'supervisor': '👮 Supervisor'
                                };

                                const agentKey = `${obj.role}_${obj.sub_trace_id || 'default'}`;

                                // If this is a different agent than the last one, show transition loading
                                if (lastAgentRole && lastAgentRole !== obj.role && !activeMessageElements[agentKey]) {
                                    console.log(`[UI] Agent transition: ${lastAgentRole} -> ${obj.role}`);
                                    showLoading(`⏳ ${labels[obj.role] || obj.role} 正在生成回复`);
                                }

                                // Create new message element if doesn't exist
                                if (!activeMessageElements[agentKey]) {
                                    // Hide loading before showing message
                                    hideLoading();

                                    const label = labels[obj.role] || obj.role;
                                    const currentAgentDiv = appendMessage('agent', '', label);
                                    activeMessageElements[agentKey] = currentAgentDiv;
                                    accumulatedContent[agentKey] = '';

                                    // Add typing cursor
                                    const cursor = document.createElement('span');
                                    cursor.className = 'typing-cursor';
                                    currentAgentDiv.appendChild(cursor);

                                    console.log(`[UI] Created message for ${label}`);
                                }

                                lastAgentRole = obj.role;

                                // Accumulate incremental content
                                accumulatedContent[agentKey] += obj.content;

                                // Update display with accumulated content
                                updateMessageContent(
                                    activeMessageElements[agentKey],
                                    accumulatedContent[agentKey]
                                );

                            } else if (obj.type === 'error') {
                                console.error('[UI] Error event:', obj);
                                hideLoading();

                                const errorDiv = appendMessage(
                                    'agent',
                                    `❌ 错误: ${obj.content}`,
                                    obj.role ? `Error from ${obj.role}` : 'Error',
                                    false,
                                    true
                                );
                            }

                        } catch (e) {
                            console.error('[UI] Parse error:', e, 'Data:', data);
                        }
                    }
                }
            }

        } catch (error) {
            console.error('[UI] Request failed:', error);
            hideLoading();
            appendMessage('agent', '❌ 请求失败: ' + error.message, 'System', false, true);
        } finally {
            // Re-enable input
            input.disabled = false;
            sendBtn.disabled = false;
            isProcessing = false;
            input.focus();

            // Clean up
            activeMessageElements = {};
            accumulatedContent = {};
            statusDiv = null;

            console.log('[UI] Cleanup done');
        }
    }
</script>
</body>
</html>
